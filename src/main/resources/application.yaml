spring:
  application:
    name: backend
  profiles:
    active: local
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

logging:
  level:
    # HTTPS/TLS probes or scanners sent to the plain HTTP port can create noisy Tomcat parser stack traces.
    org.apache.coyote.http11.Http11Processor: ERROR
    # Spring logs broker statistics every 30 minutes by default; keep production logs focused on actionable events.
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN
    # Springdoc warns when Swagger is enabled in prod; this project intentionally exposes it for API testing.
    org.springdoc.core.events.SpringDocAppInitializer: ERROR

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry: 3600000       # 1시간 (ms)
  refresh-token-expiry: 2592000000   # 30일 (ms)

solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender: ${SOLAPI_SENDER:}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    allowed-redirect-uris:
      - ${GOOGLE_REDIRECT_URI:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    allowed-redirect-uris:
      - ${KAKAO_REDIRECT_URI:}

websocket:
  # WebSocket CORS 허용 오리진 목록 (쉼표 구분)
  # 프로덕션: WEBSOCKET_ALLOWED_ORIGINS 환경변수로 반드시 덮어쓰세요 (예: https://eodigaljido.com)
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

storage:
  s3:
    # Supabase Storage S3 endpoint: https://<project-ref>.supabase.co/storage/v1/s3
    endpoint: ${SUPABASE_S3_ENDPOINT:${STORAGE_S3_ENDPOINT:}}
    region: ${SUPABASE_S3_REGION:${STORAGE_S3_REGION:ap-northeast-2}}
    bucket: ${SUPABASE_BUCKET:${STORAGE_S3_BUCKET:}}
    access-key: ${SUPABASE_S3_ACCESS_KEY:${STORAGE_S3_ACCESS_KEY:}}
    secret-key: ${SUPABASE_S3_SECRET_KEY:${STORAGE_S3_SECRET_KEY:}}
    public-base-url: ${SUPABASE_PUBLIC_BASE_URL:${STORAGE_PUBLIC_BASE_URL:}}
    path-style-access-enabled: ${SUPABASE_S3_PATH_STYLE_ACCESS_ENABLED:${STORAGE_S3_PATH_STYLE_ACCESS_ENABLED:true}}
    cache-control: ${SUPABASE_S3_CACHE_CONTROL:${STORAGE_S3_CACHE_CONTROL:public, max-age=31536000}}

weather:
  kma-api-key: ${KMA_API_KEY:}
  air-korea-api-key: ${AIR_KOREA_API_KEY:}
  kakao-api-key: ${KAKAO_API_KEY:}
